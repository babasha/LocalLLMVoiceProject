<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Translator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Voice Translator</h1>
      <span class="status-badge" id="statusBadge">Stopped</span>
    </header>

    <!-- Mode Selector -->
    <section class="card">
      <label class="card-title">Mode</label>
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="passthrough">Passthrough</button>
        <button class="mode-btn" data-mode="stt">STT Only</button>
        <button class="mode-btn" data-mode="full">Full Pipeline</button>
      </div>
    </section>

    <!-- Language Pair -->
    <section class="card">
      <label class="card-title">Languages</label>
      <div class="lang-row">
        <select id="sourceLang">
          <option value="ru" selected>Russian</option>
          <option value="en">English</option>
          <option value="de">German</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
        </select>
        <button class="swap-btn" id="swapLangs" title="Swap languages">&#8644;</button>
        <select id="targetLang">
          <option value="ru">Russian</option>
          <option value="en" selected>English</option>
          <option value="de">German</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
        </select>
      </div>
    </section>

    <!-- Start/Stop Button -->
    <section class="card center">
      <button class="start-btn" id="startBtn">Start</button>
    </section>

    <!-- Audio Devices -->
    <section class="card">
      <label class="card-title">Audio Devices</label>
      <div id="deviceList" class="device-list">
        <span class="muted">Loading...</span>
      </div>
    </section>

    <!-- Test Translation -->
    <section class="card">
      <label class="card-title">Test Translation</label>
      <textarea id="testInput" rows="2" placeholder="Type text to translate..."></textarea>
      <button class="test-btn" id="testBtn">Translate</button>
      <div class="result" id="testResult"></div>
    </section>

    <!-- Model Info -->
    <section class="card">
      <label class="card-title">Model</label>
      <div class="info-row">
        <span class="info-label">Path:</span>
        <span class="info-value" id="modelPath">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">GPU Layers:</span>
        <span class="info-value" id="gpuLayers">—</span>
      </div>
    </section>
  </div>

  <script src="main.js"></script>
</body>
</html>
